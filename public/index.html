<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AzotaV2</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.ico">
    <script src="global.js" defer></script>
    <script src="script.js" defer></script>
    <meta property="og:title" content="AzotaV2">
    <meta property="og:description" content="Đm azota">
    <meta property="og:image" content="assets/preview_img.png">
    <meta property="og:url" content="https://4u.pink.vercel.app">
    <meta property="og:type" content="website">
  </head>
  <body>
    <header>
      <button id="menu-toggle" aria-label="Toggle sidebar" aria-expanded="false">
        <span class="icon">menu</span>
      </button>
      <div class="logo"><span class="icon icon-lg">camera</span>Azota<sup>V2</sup></div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="active"><span class="icon">person</span><span>
          Tài khoản
        </span></div>
        <div><span class="icon">home</span><span>
          Tất cả môn
        </span></div>
      </aside>

      <main class="active">
        <div id="pfp-container">
          <img id="pfp" src="assets/default_pfp.jpeg">
          <div style="display:flex; flex-direction: column; justify-content: flex-start; gap:0; min-width: 0;">
            <h1 id="greeting">Xin chào</h1>
            <h1 id="username"></h1>
            <button id="upload-pfp-button">Tải lên<input type="file" id="pfpInput" accept="image/*"></button>
          </div>
        </div>

        <div id="name-container">
          <label>Tên người dùng</label>
          <input
              id="name-input"
              placeholder="Nhập tên..."
              maxlength="30"
              autocomplete="nickname"
          >
          <small id="name-error" style="color:red"></small>
        </div>
        <div id="settings-container">
            <h2>Cài đặt bài thi</h2>
            <p class="settings-description">Tùy chỉnh cách bạn làm bài</p>

            <label class="setting">
                <span>
                    <strong>Xáo trộn câu hỏi</strong>
                    <small>Thứ tự câu hỏi ngẫu nhiên</small>
                </span>
                <input type="checkbox" id="shuffle-questions">
            </label>

            <label class="setting">
                <span>
                    <strong>Xáo trộn đáp án</strong>
                    <small>Thứ tự lựa chọn ngẫu nhiên</small>
                </span>
                <input type="checkbox" id="shuffle-choices">
            </label>

            <div class="setting" style="display:none">
                <span>
                    <strong>Kiểm tra đáp án</strong>
                    <small>Chọn thời điểm chấm điểm</small>
                </span>
                <select id="check-mode">
                    <option value="immediate">Ngay sau khi chọn</option>
                    <option value="all">Kiểm tra toàn bộ cùng lúc</option>
                </select>
            </div>

            <label class="setting">
                <span>
                    <strong>Làm lại khi sai</strong>
                    <small>Tự động bắt đầu lại bài thi nếu trả lời sai</small>
                </span>
                <input type="checkbox" id="restart-on-wrong">
            </label>

            <label class="setting">
                <span>
                    <strong>Bỏ qua</strong>
                    <small>Muốn bỏ qua phần nào thì chọn</small>
                </span>
                <div class="button-group" id="skip">
                  <button type="button" id="skip_multiple_choice">Trắc nghiệm</button>
                  <button type="button" id="skip_correctness">Đúng sai</button>
                </div>
            </label>
        </div>


      </main>

      <main>
        <div class="main-top">
          <div>
            <h1>Tất cả</h1>
            <h2>làm cái l này mệt vcl</h2>
          </div>
        </div>
        <div class="exam-list active">
        </div>
      </main>
    </div>
    <template id="tab-template">
      <main>
          <div class="main-top">
              <h1></h1>
              <div class="change-page icon">trophy</div>
          </div>

          <div class="exam-list active loading"></div>
          <div class="ranking loading"></div>
      </main>
    </template>

    <template id="sidebar-button-template">
        <div>
            <span class="icon"></span>
            <span class="name"></span>
        </div>
    </template>
    <template id="exam-card-template">
      <div class="exam-option">
          <div class="exam-icon icon"></div>
          <div class="exam-details">
              <div class="exam-name"></div>
              <div class="exam-subject"></div>
          </div>
      </div>
    </template>
    <template id="rank-card-template">
      <div class="rank">
          <div class="rank-indentity">
              <img alt="">
              <div class="rank-username"></div>
              <div class="rank-score"></div>
          </div>
          <div class="breaker"></div>
          <div class="rank-info"></div>
      </div>
    </template>
  </body>
</html>
